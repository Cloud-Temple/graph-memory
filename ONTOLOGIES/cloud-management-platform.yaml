  # --- Exemple 2 : VPC (reseau) - composition de ressources + socle vs infra ---
  - input: |
      Le microservice VPC realise le produit "Reseau prive virtuel". Il gere
      des VPC, qui contiennent des reseaux prives portant des IP statiques ;
      une IP flottante peut etre rattachee a une IP statique. Le VPC repose sur
      VyOS pour realiser le routage et la configuration reseau ; il s'appuie
      sur l'orchestrateur d'infrastructure Saturne NG, persiste son etat dans
      PostgreSQL, emet ses activites dans RabbitMQ et lit sa configuration dans
      Consul. Il depend du microservice IAM pour l'authentification. Un node
      VyOS n'accepte pas deux poussees de configuration en parallele : les
      poussees sont serialisees par node. VyOS est edite par VyOS Inc.
