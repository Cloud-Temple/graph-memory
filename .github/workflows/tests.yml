name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements.lock -r requirements-test.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest
