name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-test.lock
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements.lock -r requirements-test.lock
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest
      - name: Build container
        run: docker build --tag graph-memory:test .

  go-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/graph-memory-ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/graph-memory-ingest/go.mod
          cache-dependency-path: tools/graph-memory-ingest/go.sum
      - name: Run tests
        run: go test -count=1 ./...
      - name: Run race detector
        run: go test -count=1 -race ./...
      - name: Run vet
        run: go vet ./...
      - name: Build release targets
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/graph-memory-ingest-darwin-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/graph-memory-ingest-linux-amd64 .
