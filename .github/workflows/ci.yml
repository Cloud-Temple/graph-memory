name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop
      - "release/**"

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q src scripts

      - name: Check MCP tool parameter descriptions
        run: python scripts/check_param_descriptions.py
